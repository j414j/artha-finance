<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#161b26"/>
      <stop offset="100%" stop-color="#0a0c0f"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7bb33"/>
      <stop offset="55%" stop-color="#f0a500"/>
      <stop offset="100%" stop-color="#e8860a"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00e0a8"/>
      <stop offset="100%" stop-color="#00c896"/>
    </linearGradient>
  </defs>

  <!-- full-bleed background; OS applies its own mask shape -->
  <rect width="512" height="512" fill="url(#bgGrad)"/>

  <!-- monogram scaled down and centered to survive circular safe-area cropping -->
  <g transform="translate(256 256) scale(0.62) translate(-256 -256)">
    <path d="M 152 392 L 256 122 L 360 392"
          fill="none"
          stroke="url(#accentGrad)"
          stroke-width="46"
          stroke-linecap="round"
          stroke-linejoin="round"/>
    <circle cx="256" cy="122" r="15" fill="#ffd166"/>
    <rect x="196" y="281" width="120" height="30" rx="15" fill="url(#greenGrad)"/>
  </g>
</svg>
